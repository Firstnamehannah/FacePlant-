classes:
  MIAPPESubmission:
    name: MIAPPESubmission
    definition_uri: https://github.com/Firstnamehannah/FacePlant-MIAPPESubmission
    description: A complete MIAPPE submission containing exactly one investigation.
    from_schema: https://w3id.org/your-org/faceplant
    slots:
    - investigation
    class_uri: faceplant:MIAPPESubmission
    tree_root: true
  Investigation:
    name: Investigation
    definition_uri: https://github.com/Firstnamehannah/FacePlant-Investigation
    description: 'Investigations are research programmes with defined aims. They can
      exist at various scales, including a grant-funded programme, a publication,
      or a single experiment.

      '
    from_schema: https://w3id.org/your-org/faceplant
    slots:
    - investigationId
    - investigationTitle
    - investigationDescription
    - submissionDate
    - publicReleaseDate
    - license
    - miappeVersion
    - associatedPublication
    - Investigation_persons
    - Investigation_studies
    slot_usage:
      persons:
        name: persons
        annotations:
          miappe_cardinality:
            tag: miappe_cardinality
            value: 1+ per investigation
        required: true
      studies:
        name: studies
        annotations:
          miappe_cardinality:
            tag: miappe_cardinality
            value: 1+ per investigation
        required: true
    class_uri: faceplant:Investigation
  Study:
    name: Study
    definition_uri: https://github.com/Firstnamehannah/FacePlant-Study
    description: 'A study or experiment comprises a series of assays or measurements
      of one or more types, undertaken to answer a particular biological question.

      '
    from_schema: https://w3id.org/your-org/faceplant
    slots:
    - studyId
    - studyTitle
    - studyDescription
    - studyStartDate
    - studyEndDate
    - contactInst
    - locationCountry
    - siteName
    - locationLatitude
    - locationLongitude
    - locationAltitude
    - expeDesignDesc
    - expeDesignType
    - obsUnitLevelHierarchy
    - obsUnitDesc
    - growthFacilityDesc
    - growthFacilityType
    - culturalPractice
    - expeDesignMap
    - Study_persons
    - dataFiles
    - Study_biologicalMaterials
    - environment
    - experimentalFactors
    - events
    - Study_observationUnits
    - Study_observedVariables
    slot_usage:
      persons:
        name: persons
        annotations:
          miappe_cardinality:
            tag: miappe_cardinality
            value: 0+ per study
        required: false
      biologicalMaterials:
        name: biologicalMaterials
        annotations:
          miappe_cardinality:
            tag: miappe_cardinality
            value: 1+ per study
        required: true
      observationUnits:
        name: observationUnits
        annotations:
          miappe_cardinality:
            tag: miappe_cardinality
            value: 1+ per study
        required: true
      observedVariables:
        name: observedVariables
        annotations:
          miappe_cardinality:
            tag: miappe_cardinality
            value: 1+ per study
        required: true
    class_uri: faceplant:Study
  Person:
    name: Person
    definition_uri: https://github.com/Firstnamehannah/FacePlant-Person
    description: A human involved in the investigation or specifically in one of its
      studies.
    from_schema: https://w3id.org/your-org/faceplant
    slots:
    - personName
    - personEmail
    - personId
    - personRole
    - personAffiliation
    class_uri: faceplant:Person
  DataFile:
    name: DataFile
    definition_uri: https://github.com/Firstnamehannah/FacePlant-DataFile
    description: 'A file or digital object holding observation data recorded during
      one or more assays of the study, typically in tabular form.

      '
    from_schema: https://w3id.org/your-org/faceplant
    slots:
    - dataFileLink
    - dataFileDesc
    - dataFileVersion
    class_uri: faceplant:DataFile
