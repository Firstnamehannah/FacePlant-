      externalId:
        name: externalId
        annotations:
          miappe_label:
            tag: miappe_label
            value: Sample external ID
          miappe_cardinality:
            tag: miappe_cardinality
            value: 0+
        description: 'Identifier for the sample in a persistent repository, comprising
          the repository name and sample accession number.

          '
    class_uri: faceplant:Sample
  ObservedVariable:
    name: ObservedVariable
    definition_uri: https://github.com/Firstnamehannah/FacePlant-ObservedVariable
    description: 'Description of how a measurement has been made, usually a trait
