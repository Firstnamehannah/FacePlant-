      externalId:
        name: externalId
        annotations:
          miappe_label:
            tag: miappe_label
            value: Observation unit external ID
          miappe_cardinality:
            tag: miappe_cardinality
            value: 0+
        description: 'Identifier for the observation unit in a persistent repository,
          comprising the repository name and observation unit identifier.

          '
    class_uri: faceplant:ObservationUnit
  Sample:
    name: Sample
    definition_uri: https://github.com/Firstnamehannah/FacePlant-Sample
    description: 'A portion of plant tissue harvested, non-harvested, or extracted
