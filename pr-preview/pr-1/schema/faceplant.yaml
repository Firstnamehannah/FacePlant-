name: faceplant
annotations:
  source:
    tag: source
    value: Derived from the MIAPPE LinkML schema (https://github.com/lakehouse-code/datamodel/blob/main/miappe.yaml),
      itself generated from MIAPPE_Checklist_Data_Model.tsv in the MIAPPE/MIAPPE GitHub
      repository.
  source_version:
    tag: source_version
    value: MIAPPE 1.2
description: 'A LinkML data model for plant phenotypic data, based on the Minimum
  Information About a Plant Phenotyping Experiment (MIAPPE v1.2) checklist. Slot names
  follow the original MIAPPE codenames for traceability.

  '
title: 'FacePlant: a plant phenotypic data model'
id: https://w3id.org/your-org/faceplant
version: 0.1.0
imports:
- linkml:types
license: https://creativecommons.org/licenses/by/4.0/
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  faceplant:
    prefix_prefix: faceplant
    prefix_reference: https://github.com/Firstnamehannah/FacePlant-
  miappe:
    prefix_prefix: miappe
    prefix_reference: https://w3id.org/miappe/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  ORCID:
    prefix_prefix: ORCID
    prefix_reference: http://identifiers.org/orcid/
  DOI:
    prefix_prefix: DOI
    prefix_reference: http://identifiers.org/doi/
  NCBITaxon:
    prefix_prefix: NCBITaxon
    prefix_reference: http://purl.obolibrary.org/obo/NCBITaxon_
  CO:
    prefix_prefix: CO
    prefix_reference: http://purl.obolibrary.org/obo/CO_
  CO_322:
    prefix_prefix: CO_322
    prefix_reference: 'https://cropontology.org/rdf/CO_322:'
  CO_715:
    prefix_prefix: CO_715
    prefix_reference: http://purl.obolibrary.org/obo/CO_715_
  PO:
    prefix_prefix: PO
    prefix_reference: http://purl.obolibrary.org/obo/PO_
  PATO:
    prefix_prefix: PATO
    prefix_reference: http://purl.obolibrary.org/obo/PATO_
  TO:
    prefix_prefix: TO
    prefix_reference: http://purl.obolibrary.org/obo/TO_
  EO:
    prefix_prefix: EO
    prefix_reference: http://purl.obolibrary.org/obo/EO_
default_prefix: faceplant
default_range: string
types:
  iso8601DateTime:
    name: iso8601DateTime
    definition_uri: https://github.com/Firstnamehannah/FacePlant-Iso8601DateTime
    description: ISO 8601 date or date-time, with optional timezone.
    from_schema: https://w3id.org/your-org/faceplant
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^\d{4}-\d{2}-\d{2}([Tt ][0-9:.+-]+(Z|[+-][0-9]{2}:[0-9]{2})?)?$
  measurementWithUnit:
    name: measurementWithUnit
    definition_uri: https://github.com/Firstnamehannah/FacePlant-MeasurementWithUnit
    description: Numeric value followed by a unit abbreviation, as used in the MIAPPE
      checklist.
    from_schema: https://w3id.org/your-org/faceplant
    typeof: string
    base: str
    uri: xsd:string
  keyValueList:
    name: keyValueList
    definition_uri: https://github.com/Firstnamehannah/FacePlant-KeyValueList
    description: Key-value pair list encoded as text, usually separated by commas
      or semicolons.
    from_schema: https://w3id.org/your-org/faceplant
    typeof: string
    base: str
    uri: xsd:string
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
slots:
  investigation:
    name: investigation
    definition_uri: https://github.com/Firstnamehannah/FacePlant-investigation
    description: The single investigation represented by a MIAPPE submission.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:investigation
    owner: MIAPPESubmission
    domain_of:
    - MIAPPESubmission
    range: Investigation
    required: true
    inlined: true
    inlined_as_list: true
  studies:
    name: studies
    definition_uri: https://github.com/Firstnamehannah/FacePlant-studies
    description: Studies belonging to an investigation.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:studies
    owner: Investigation
    domain_of:
    - Investigation
    range: Study
    multivalued: true
    inlined: true
    inlined_as_list: true
  persons:
    name: persons
    definition_uri: https://github.com/Firstnamehannah/FacePlant-persons
    description: People associated with an investigation or study.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:persons
    owner: Study
    domain_of:
    - Investigation
    - Study
    range: Person
    multivalued: true
    inlined: true
    inlined_as_list: true
  dataFiles:
    name: dataFiles
    definition_uri: https://github.com/Firstnamehannah/FacePlant-dataFiles
    annotations:
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0+ per study
    description: Data files associated with a study.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:dataFiles
    owner: Study
    domain_of:
    - Study
    range: DataFile
    multivalued: true
    inlined: true
    inlined_as_list: true
  biologicalMaterials:
    name: biologicalMaterials
    definition_uri: https://github.com/Firstnamehannah/FacePlant-biologicalMaterials
    description: Biological materials associated with a study.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:biologicalMaterials
    owner: Study
    domain_of:
    - Study
    range: BiologicalMaterial
    multivalued: true
    inlined: true
    inlined_as_list: true
  biologicalMaterialRefs:
    name: biologicalMaterialRefs
    definition_uri: https://github.com/Firstnamehannah/FacePlant-biologicalMaterialRefs
    annotations:
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0+ per observation unit
    description: 'References from an observation unit to biological material identifiers
      defined in the study-level biologicalMaterials list.

      '
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:biologicalMaterialRefs
    owner: ObservationUnit
    domain_of:
    - ObservationUnit
    range: string
    multivalued: true
  environment:
    name: environment
    definition_uri: https://github.com/Firstnamehannah/FacePlant-environment
    annotations:
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0-1 per study
    description: Constant environmental parameters for a study.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:environment
    owner: Study
    domain_of:
    - Study
    range: Environment
    inlined: true
    inlined_as_list: true
  environmentParameters:
    name: environmentParameters
    definition_uri: https://github.com/Firstnamehannah/FacePlant-environmentParameters
    description: Constant environmental parameter values for a study.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:environmentParameters
    owner: Environment
    domain_of:
    - Environment
    range: EnvironmentParameter
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  experimentalFactors:
    name: experimentalFactors
    definition_uri: https://github.com/Firstnamehannah/FacePlant-experimentalFactors
    annotations:
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0+ per study
    description: Experimental factors associated with a study.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:experimentalFactors
    owner: Study
    domain_of:
    - Study
    range: ExperimentalFactor
    multivalued: true
    inlined: true
    inlined_as_list: true
  events:
    name: events
    definition_uri: https://github.com/Firstnamehannah/FacePlant-events
    annotations:
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0+ per study or observation unit
    description: Events associated with a study or observation unit.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:events
    owner: ObservationUnit
    domain_of:
    - Study
    - ObservationUnit
    range: Event
    multivalued: true
    inlined: true
    inlined_as_list: true
  observationUnits:
    name: observationUnits
    definition_uri: https://github.com/Firstnamehannah/FacePlant-observationUnits
    description: Observation units associated with a study.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:observationUnits
    owner: Study
    domain_of:
    - Study
    range: ObservationUnit
    multivalued: true
    inlined: true
    inlined_as_list: true
  samples:
    name: samples
    definition_uri: https://github.com/Firstnamehannah/FacePlant-samples
    annotations:
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0+ per observation unit
    description: Samples associated with an observation unit.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:samples
    owner: ObservationUnit
    domain_of:
    - ObservationUnit
    range: Sample
    multivalued: true
    inlined: true
    inlined_as_list: true
  observedVariables:
    name: observedVariables
    definition_uri: https://github.com/Firstnamehannah/FacePlant-observedVariables
    description: Observed variables associated with a study.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:observedVariables
    owner: Study
    domain_of:
    - Study
    range: ObservedVariable
    multivalued: true
    inlined: true
    inlined_as_list: true
  investigationId:
    name: investigationId
    definition_uri: https://github.com/Firstnamehannah/FacePlant-investigationId
    annotations:
      miappe_label:
        tag: miappe_label
        value: Investigation unique ID
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0-1
      miappe_format:
        tag: miappe_format
        value: Unique identifier
    description: 'Identifier comprising the unique name of the institution/database
      hosting the submission and the accession number of the investigation there.

      '
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:investigationId
    owner: Investigation
    domain_of:
    - Investigation
    range: uriorcurie
  investigationTitle:
    name: investigationTitle
    definition_uri: https://github.com/Firstnamehannah/FacePlant-investigationTitle
    annotations:
      miappe_label:
        tag: miappe_label
        value: Investigation title
      miappe_cardinality:
        tag: miappe_cardinality
        value: '1'
      miappe_format:
        tag: miappe_format
        value: Free text (short)
    description: Human-readable string summarising the investigation.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:investigationTitle
    owner: Investigation
    domain_of:
    - Investigation
    range: string
    required: true
  investigationDescription:
    name: investigationDescription
    definition_uri: https://github.com/Firstnamehannah/FacePlant-investigationDescription
    annotations:
      miappe_label:
        tag: miappe_label
        value: Investigation description
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0-1
      miappe_format:
        tag: miappe_format
        value: Free text
    description: Human-readable text describing the investigation in more detail.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:investigationDescription
    owner: Investigation
    domain_of:
    - Investigation
    range: string
  submissionDate:
    name: submissionDate
    definition_uri: https://github.com/Firstnamehannah/FacePlant-submissionDate
    annotations:
      miappe_label:
        tag: miappe_label
        value: Submission date
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0-1
      miappe_format:
        tag: miappe_format
        value: Date/Time (ISO 8601, optional time zone)
    description: Date of submission of the dataset being described to a host repository.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:submissionDate
    owner: Investigation
    domain_of:
    - Investigation
    range: iso8601DateTime
  publicReleaseDate:
    name: publicReleaseDate
    definition_uri: https://github.com/Firstnamehannah/FacePlant-publicReleaseDate
    annotations:
      miappe_label:
        tag: miappe_label
        value: Public release date
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0-1
      miappe_format:
        tag: miappe_format
        value: Date/Time (ISO 8601, optional time zone)
    description: Date of first public release of the dataset being described.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:publicReleaseDate
    owner: Investigation
    domain_of:
    - Investigation
    range: iso8601DateTime
  license:
    name: license
    definition_uri: https://github.com/Firstnamehannah/FacePlant-license
    annotations:
      miappe_label:
        tag: miappe_label
        value: License
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0-1
      miappe_format:
        tag: miappe_format
        value: Unique identifier
    description: License for reuse of the data associated with this investigation.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:license
    owner: Investigation
    domain_of:
    - Investigation
    range: string
  miappeVersion:
    name: miappeVersion
    definition_uri: https://github.com/Firstnamehannah/FacePlant-miappeVersion
    annotations:
      miappe_label:
        tag: miappe_label
        value: MIAPPE version
      miappe_cardinality:
        tag: miappe_cardinality
        value: '1'
      miappe_format:
        tag: miappe_format
        value: Version number
    description: The version of MIAPPE used.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:miappeVersion
    owner: Investigation
    domain_of:
    - Investigation
    range: string
    required: true
  associatedPublication:
    name: associatedPublication
    definition_uri: https://github.com/Firstnamehannah/FacePlant-associatedPublication
    annotations:
      miappe_label:
        tag: miappe_label
        value: Associated publication
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0+
      miappe_format:
        tag: miappe_format
        value: DOI
    description: Identifier for a literature publication where the investigation is
      described.
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:associatedPublication
    owner: Investigation
    domain_of:
    - Investigation
    range: uriorcurie
    multivalued: true
  studyId:
    name: studyId
    definition_uri: https://github.com/Firstnamehannah/FacePlant-studyId
    annotations:
      miappe_label:
        tag: miappe_label
        value: Study unique ID
      miappe_cardinality:
        tag: miappe_cardinality
        value: 0-1
      miappe_format:
        tag: miappe_format
        value: Unique identifier
    description: 'Unique identifier comprising the name or identifier for the institution
      or database hosting the study data and the identifier of the study there.

      '
    from_schema: https://w3id.org/your-org/faceplant
    slot_uri: faceplant:studyId
    owner: Study
    domain_of:
    - Study
    range: uriorcurie
